[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "logspecter"
version = "0.1.0"
description = "Schema-aware, entropy-validated secret scanner for cloud logs. Streams tens of GB with a flat ~50 MB memory ceiling."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "LogSpecter Contributors" }]
keywords = [
    "security",
    "secret-scanning",
    "cloudtrail",
    "logging",
    "shannon-entropy",
    "dfir",
    "soc2",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Logging",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "PyYAML>=6.0",
    "orjson>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/logspecter/logspecter"
Repository = "https://github.com/logspecter/logspecter"
Issues = "https://github.com/logspecter/logspecter/issues"

[project.scripts]
logspecter = "logspecter.cli:main"
cloudleak = "logspecter.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/logspecter"]

[tool.hatch.build.targets.sdist]
include = ["src/logspecter", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: long-running benchmark style tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",   # 行宽交给 formatter
    "B905",   # zip(strict=) 在 3.9 不可用
    # 本项目的注释与文档字符串使用中文，全角标点是有意为之
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
# Typer 的惯用法就是把 typer.Option()/typer.Argument() 写在参数默认值里
"src/logspecter/cli.py" = ["B008"]

[tool.coverage.run]
source = ["logspecter"]
branch = true
